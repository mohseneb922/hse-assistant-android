name: Build HSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'


      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android
- name: Generate Android App Icons
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          img = Image.open("icon.png").convert("RGBA")
          w, h = img.size
          side = min(w, h)
          img = img.crop(((w-side)//2, (h-side)//2,
                          (w+side)//2, (h+side)//2))

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          base = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              path = base / folder
              path.mkdir(parents=True, exist_ok=True)
              icon = img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(path / "ic_launcher.png")
              icon.save(path / "ic_launcher_round.png")

          adaptive = base / "mipmap-anydpi-v26"
          if adaptive.exists():
              (adaptive / "ic_launcher.xml").unlink(missing_ok=True)
              (adaptive / "ic_launcher_round.xml").unlink(missing_ok=True)
          PY


      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Assistant-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

