name: Validate HSE source

on:
  push:
    branches:
      - feature/hse-general-purpose
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("npm-audit.json").read_text())
          for name, item in sorted(report.get("vulnerabilities", {}).items()):
              via = [x if isinstance(x, str) else x.get("title", "") for x in item.get("via", [])]
              print(f"{item.get('severity', 'unknown').upper()}: {name} | range={item.get('range', '')} | fix={item.get('fixAvailable')} | {', '.join(via)}")
          PY
      - name: Audit production dependencies (non-blocking)
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::Production dependency audit reported vulnerabilities. Review the audit output above; this warning does not mean the vulnerabilities are fixed."
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
