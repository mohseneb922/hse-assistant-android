
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دستیار HSE</title>

<style>
:root{--bg:#f1f3f4;--cd:#fff;--tx:#14202b;--mu:#5b6b78;--bd:#d9dfe3;--ac:#0b5cab;--on:#fff;--ok:#15803d;--bad:#c62828;--wr:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--cd:#192229;--tx:#e8eef2;--mu:#93a4b0;--bd:#2b3841;--ac:#5aa9f0;--on:#0b1218;--ok:#4ade80;--bad:#ff7b72;--wr:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--cd:#192229;--tx:#e8eef2;--mu:#93a4b0;--bd:#2b3841;--ac:#5aa9f0;--on:#0b1218;--ok:#4ade80;--bad:#ff7b72;--wr:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:10}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;gap:2px;padding:0 6px}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:12px 11px;font:inherit;font-weight:700;cursor:pointer}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{padding:14px;max-width:640px;margin:auto}
h2{margin:4px 0 12px;font-size:19px}
.cd{background:var(--cd);border:1px solid var(--bd);border-inline-start:5px solid var(--bd);border-radius:8px;padding:11px 13px;margin:10px 0}
.cd.ok{border-inline-start-color:var(--ok)}.cd.bad{border-inline-start-color:var(--bad)}.cd.wr{border-inline-start-color:var(--wr)}
.mu{color:var(--mu);font-size:13px}
.b{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.b.g{background:none;color:var(--ac);border:1px solid var(--bd);padding:5px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:99px;border:1px solid currentColor;margin:2px 0 2px 4px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.wr-t{color:var(--wr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.st b{display:block;font-size:26px;line-height:1.2}
label{display:block;margin:9px 0;font-size:13px;color:var(--mu)}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:3px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.md{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end;justify-content:center}
.sh{background:var(--cd);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 6px}
.tr{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px;color:var(--tx)}
.tr input[type=date]{margin:0;flex:1}
details{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:9px 13px;margin:8px 0}
summary{font-weight:700;cursor:pointer}
details p{margin:6px 0 2px}
#pv .rc{border:1px solid #000;padding:6px 10px;margin:8px 0;page-break-inside:avoid}#pv h4{margin:12px 0 2px;border-bottom:1px solid #000;font-size:14px}#pv .mu{color:#444}
@media print{body>*:not(#md){display:none!important}body::before{display:none}#md{position:static!important;display:block!important;background:none!important}.sh{max-height:none!important;overflow:visible!important;background:#fff!important;padding:0!important;border-radius:0!important}.no{display:none!important}}
textarea{direction:ltr;font-size:12px}
</style>
</head>
<body>
<nav id="nv"></nav>
<main id="v"></main>
<div class="md" id="md"></div>

<div id="hse-boot" style="position:fixed;inset:0;z-index:9999;background:#f1f3f4;color:#14202b;display:flex;align-items:center;justify-content:center;font:16px Tahoma,sans-serif">
در حال آماده‌سازی دستیار HSE…
</div>

<script>
window.addEventListener('error', function(e) {
  const b = document.getElementById('hse-boot');
  if (b) {
    b.style.display = 'flex';
    b.textContent = 'خطا: ' + e.message + ' | خط: ' + e.lineno;
  }
});

window.addEventListener('unhandledrejection', function(e) {
  const b = document.getElementById('hse-boot');
  if (b) {
    b.style.display = 'flex';
    b.textContent = 'خطای برنامه: ' + (e.reason?.message || e.reason);
  }
});
</script>

<script type="module" src="./db-init.js"></script>
</body>
</html>
