
name: Build HSE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Copy application script
        run: |
          test -f www/app.js
          mkdir -p dist
          cp www/app.js dist/app.js
          test -s dist/app.js
          echo "app.js successfully copied to dist"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure persistent app signing and version
        env:
          HSE_KEYSTORE_BASE64: ${{ secrets.HSE_KEYSTORE_BASE64 }}
          HSE_KEYSTORE_PASSWORD: ${{ secrets.HSE_KEYSTORE_PASSWORD }}
          HSE_KEY_ALIAS: ${{ secrets.HSE_KEY_ALIAS }}
          HSE_KEY_PASSWORD: ${{ secrets.HSE_KEY_PASSWORD }}
        run: |
          test -n "$HSE_KEYSTORE_BASE64"
          test -n "$HSE_KEYSTORE_PASSWORD"
          test -n "$HSE_KEY_ALIAS"
          test -n "$HSE_KEY_PASSWORD"
          echo "$HSE_KEYSTORE_BASE64" | base64 --decode > android/app/hse-release.keystore
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          version = json.loads(Path("package.json").read_text())["version"]
          version_code = 10000 + int(os.environ.get("GITHUB_RUN_NUMBER", "1"))

          source, code_count = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", source, count=1)
          source, name_count = re.subn(r"versionName\s+['\"]([^'\"]+)['\"]", f'versionName "{version}"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")

          signing = """
              signingConfigs {
                  hseRelease {
                      storeFile file("hse-release.keystore")
                      storePassword System.getenv("HSE_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("HSE_KEY_ALIAS")
                      keyPassword System.getenv("HSE_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in source:
              source, count = re.subn(r"android\s*\{", lambda m: m.group(0) + signing, source, count=1)
              if count != 1:
                  raise SystemExit("Could not insert Android signing configuration")

          debug_signing = """debug {
                      signingConfig signingConfigs.hseRelease
                  }
                  """
          if re.search(r"buildTypes\s*\{", source):
              source, count = re.subn(r"buildTypes\\s*\\{", lambda m: m.group(0) + "\n                  " + debug_signing, source, count=1)
          else:
              raise SystemExit("Could not find Android buildTypes block")

          gradle.write_text(source)
          print(f"Configured persistent signing; versionCode={version_code}, versionName={version}")
          PY

      - name: Generate Android App Icons
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          img = Image.open("file_000000003d9481f482c05f80ca212044.jpg").convert("RGBA")

          w, h = img.size
          side = min(w, h)
          img = img.crop((
              (w-side)//2,
              (h-side)//2,
              (w+side)//2,
              (h+side)//2
          ))

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          base = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              path = base / folder
              path.mkdir(parents=True, exist_ok=True)

              icon = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(path / "ic_launcher.png")
              icon.save(path / "ic_launcher_round.png")

          adaptive = base / "mipmap-anydpi-v26"

          if adaptive.exists():
              (adaptive / "ic_launcher.xml").unlink(missing_ok=True)
              (adaptive / "ic_launcher_round.xml").unlink(missing_ok=True)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSE-Assistant-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
